<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Washington Wizards Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">W</span>
        <div class="brand-text">
          <h1>Washington Wizards</h1>
          <p class="brand-sub" id="season-label">Season overview</p>
        </div>
      </div>
      <p class="record-badge" id="record-badge" hidden></p>
    </div>
  </header>

  <main class="wrap">
    <p class="status" id="loading" role="status">Loading dashboard data&hellip;</p>

    <div class="error-banner" id="error" role="alert" hidden></div>

    <div id="dashboard" hidden>

      <section class="section" aria-labelledby="overview-heading">
        <h2 class="section-title" id="overview-heading">Season overview</h2>
        <div class="card-grid" id="stat-cards"></div>
      </section>

      <section class="section" aria-labelledby="recent-heading">
        <h2 class="section-title" id="recent-heading">Last 5 games</h2>
        <ul class="game-list" id="recent-games"></ul>
      </section>

      <section class="section" id="roster-section" aria-labelledby="roster-heading">
        <div class="section-head">
          <h2 class="section-title" id="roster-heading">Player stats</h2>
          <input
            type="search"
            id="player-filter"
            class="filter-input"
            placeholder="Filter by name"
            aria-label="Filter players by name"
            autocomplete="off">
        </div>
        <div class="table-wrap">
          <table class="player-table" id="player-table">
            <thead>
              <tr id="player-table-head"></tr>
            </thead>
            <tbody id="player-table-body"></tbody>
          </table>
        </div>
        <p class="table-empty" id="table-empty" hidden>No players match that filter.</p>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="last-updated">&mdash;</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
